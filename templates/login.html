{% extends 'base.html' %}

{% block title %}Sign In{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12">
    <div class="bg-slate-900/90 border border-slate-800 rounded-3xl p-8 shadow-2xl">
        <div class="text-center mb-6">
            <div class="w-12 h-12 rounded-2xl bg-cyan-500/10 text-cyan-400 flex items-center justify-center mx-auto mb-3 text-xl font-bold">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h1 class="text-xl font-bold text-white">Sign In to Sentinel AI</h1>
            <p class="text-xs text-slate-400 mt-1">Access your email security history and audit logs</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">
                    Email Address
                </label>
                <input type="email" name="email" required placeholder="you@example.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500 font-mono">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">
                    Password
                </label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500">
            </div>

            <div class="pt-2">
                <button type="submit" class="w-full py-3 rounded-xl font-bold text-sm text-white bg-gradient-to-r from-cyan-600 to-indigo-600 hover:from-cyan-500 hover:to-indigo-500 shadow-lg shadow-cyan-600/30 transition-all flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i>
                    <span>Sign In</span>
                </button>
            </div>
        </form>

        <div class="mt-6 pt-4 border-t border-slate-800 text-center text-xs text-slate-400">
            Don't have an account? 
            <a href="{{ url_for('register') }}" class="text-cyan-400 font-semibold hover:underline">
                Register here
            </a>
        </div>
    </div>
</div>
{% endblock %}
