{% extends 'base.html' %}

{% block title %}Register — Sentinel AI{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-6 sm:py-12">
    <div class="w-full max-w-md space-y-6">

        <!-- Sentinel Cyber Card -->
        <div class="bg-slate-900/90 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl backdrop-blur-xl relative overflow-hidden">
            <!-- Ambient Glow Accents -->
            <div class="absolute -top-16 -right-16 w-36 h-36 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-16 -left-16 w-36 h-36 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>

            <!-- Header & Branding -->
            <div class="text-center mb-6 relative">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center mx-auto mb-3 shadow-lg shadow-cyan-500/25 ring-1 ring-cyan-400/30">
                    <i class="fa-solid fa-user-shield text-white text-2xl"></i>
                </div>
                <h1 class="text-2xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-indigo-300 to-purple-300 tracking-wider">
                    SENTINEL
                </h1>
                <p class="text-xs uppercase tracking-widest text-slate-400 font-mono mt-1">
                    AI-Powered Spam & Cyber Threat Protection
                </p>
                <div class="mt-2 inline-flex items-center space-x-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-mono bg-indigo-500/10 text-indigo-300 border border-indigo-500/20">
                    <span class="w-1.5 h-1.5 rounded-full bg-indigo-400 animate-pulse"></span>
                    <span>New Analyst Registration</span>
                </div>
            </div>

            <!-- Dual Option Navigation Tabs (Login / Register) -->
            <div class="flex p-1 bg-slate-950/80 rounded-2xl border border-slate-800 mb-6 shadow-inner">
                <a href="{{ url_for('login') }}" class="flex-1 py-2.5 text-center rounded-xl text-xs font-bold transition-all text-slate-400 hover:text-white hover:bg-slate-800/60">
                    <i class="fa-solid fa-lock mr-1.5"></i> Login
                </a>
                <a href="{{ url_for('register') }}" class="flex-1 py-2.5 text-center rounded-xl text-xs font-bold transition-all bg-gradient-to-r from-cyan-600 to-indigo-600 text-white shadow-lg shadow-cyan-600/30">
                    <i class="fa-solid fa-user-plus mr-1.5"></i> Register
                </a>
            </div>

            <!-- Register Form -->
            <form method="POST" action="{{ url_for('register') }}" id="registerForm" class="space-y-4">
                
                <!-- Full Name Input -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5 flex items-center justify-between">
                        <span>Full Name</span>
                        <span class="text-[10px] text-slate-500 font-mono">Required</span>
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 pointer-events-none">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" name="name" value="{{ name or '' }}" required autofocus minlength="2" maxlength="100"
                               placeholder="e.g. Alex Mercer"
                               class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all">
                    </div>
                </div>

                <!-- Email Input -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5 flex items-center justify-between">
                        <span>Email</span>
                        <span class="text-[10px] text-slate-500 font-mono">Required</span>
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 pointer-events-none">
                            <i class="fa-solid fa-envelope"></i>
                        </span>
                        <input type="email" name="email" value="{{ email or '' }}" required
                               placeholder="analyst@sentinel.shield"
                               autocomplete="email"
                               class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 font-mono transition-all">
                    </div>
                </div>

                <!-- Password Input -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5 flex items-center justify-between">
                        <span>Password</span>
                        <span class="text-[10px] text-slate-500 font-mono">Min. 6 chars</span>
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 pointer-events-none">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" name="password" id="regPassword" required minlength="6"
                               placeholder="••••••••"
                               autocomplete="new-password"
                               class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-11 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all">
                        <button type="button" onclick="togglePasswordVisibility('regPassword', this)" 
                                class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500 hover:text-slate-300 focus:outline-none"
                                title="Toggle password visibility">
                            <i class="fa-solid fa-eye text-xs"></i>
                        </button>
                    </div>
                </div>

                <!-- Confirm Password Input -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5 flex items-center justify-between">
                        <span>Confirm Password</span>
                        <span id="matchFeedback" class="text-[10px] text-slate-500 font-mono">Verify Match</span>
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 pointer-events-none">
                            <i class="fa-solid fa-shield-keyhole"></i>
                        </span>
                        <input type="password" name="confirm_password" id="regConfirmPassword" required minlength="6"
                               placeholder="••••••••"
                               autocomplete="new-password"
                               class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-11 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all">
                        <button type="button" onclick="togglePasswordVisibility('regConfirmPassword', this)" 
                                class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500 hover:text-slate-300 focus:outline-none"
                                title="Toggle password visibility">
                            <i class="fa-solid fa-eye text-xs"></i>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="pt-2">
                    <button type="submit" 
                            class="w-full py-3 rounded-xl font-bold text-sm text-white bg-gradient-to-r from-cyan-600 to-indigo-600 hover:from-cyan-500 hover:to-indigo-500 active:scale-[0.99] shadow-lg shadow-cyan-600/30 transition-all flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-shield-check"></i>
                        <span>CREATE ACCOUNT</span>
                    </button>
                </div>
            </form>

            <!-- Bottom Redirect Link -->
            <div class="mt-6 pt-5 border-t border-slate-800/80 text-center text-xs text-slate-400">
                Already have an account? 
                <a href="{{ url_for('login') }}" class="text-cyan-400 font-semibold hover:text-cyan-300 hover:underline transition-colors ml-1">
                    Login
                </a>
            </div>
        </div>

        <!-- Security Features Badges -->
        <div class="grid grid-cols-3 gap-2 text-center text-[10px] font-mono text-slate-400">
            <div class="p-2 rounded-xl bg-slate-900/50 border border-slate-800/60">
                <i class="fa-solid fa-lock text-cyan-400 block mb-1"></i>
                <span>Argon/PBKDF2</span>
            </div>
            <div class="p-2 rounded-xl bg-slate-900/50 border border-slate-800/60">
                <i class="fa-solid fa-shield-halved text-indigo-400 block mb-1"></i>
                <span>Encrypted Store</span>
            </div>
            <div class="p-2 rounded-xl bg-slate-900/50 border border-slate-800/60">
                <i class="fa-solid fa-user-lock text-emerald-400 block mb-1"></i>
                <span>Isolated Audit</span>
            </div>
        </div>

    </div>
</div>

<script>
function togglePasswordVisibility(fieldId, btn) {
    const input = document.getElementById(fieldId);
    if (!input) return;
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
        input.type = 'text';
        if (icon) {
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        }
    } else {
        input.type = 'password';
        if (icon) {
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }
}

// Live password matching validation
const p1 = document.getElementById('regPassword');
const p2 = document.getElementById('regConfirmPassword');
const feedback = document.getElementById('matchFeedback');
const form = document.getElementById('registerForm');

function checkMatch() {
    if (!p2.value) {
        feedback.textContent = 'Verify Match';
        feedback.className = 'text-[10px] text-slate-500 font-mono';
        p2.classList.remove('border-rose-500', 'border-emerald-500');
        return;
    }
    if (p1.value === p2.value) {
        feedback.textContent = '✓ Passwords match';
        feedback.className = 'text-[10px] text-emerald-400 font-mono font-semibold';
        p2.classList.remove('border-rose-500');
        p2.classList.add('border-emerald-500');
    } else {
        feedback.textContent = '✗ Passwords do not match';
        feedback.className = 'text-[10px] text-rose-400 font-mono font-semibold';
        p2.classList.remove('border-emerald-500');
        p2.classList.add('border-rose-500');
    }
}

if (p1 && p2) {
    p1.addEventListener('input', checkMatch);
    p2.addEventListener('input', checkMatch);
}

if (form) {
    form.addEventListener('submit', function(e) {
        if (p1.value.length < 6) {
            e.preventDefault();
            alert('Password must be at least 6 characters long.');
            p1.focus();
            return false;
        }
        if (p1.value !== p2.value) {
            e.preventDefault();
            alert('Passwords do not match. Please verify.');
            p2.focus();
            return false;
        }
    });
}
</script>
{% endblock %}
